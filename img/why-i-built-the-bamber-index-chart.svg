<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 148" width="420" height="148" role="img"><title>Bar chart of wealth data for 2025: UBS counted nearly 1 million new dollar millionaires and Henley &amp; Partners forecast that 142,000 millionaires would move country. No comparable data ranks destinations by prestige.</title><text x="0" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#5E5654">New dollar millionaires (UBS)</text><rect x="0" y="30" width="230" height="30" fill="#9A928B"/><text x="240" y="52" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#231A1A">Nearly 1 million</text><text x="0" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#5E5654">Millionaires forecast to move country (Henley &amp; Partners)</text><rect x="0" y="106" width="32.7" height="30" fill="#5C1A1F"/><text x="42.7" y="128" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#231A1A">142,000</text><line x1="0" y1="147.5" x2="420" y2="147.5" stroke="#DCD4CB" stroke-width="1"/></svg>
